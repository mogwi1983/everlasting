    #loading[hidden], [hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(20px, 5vw, 32px); overflow-wrap: anywhere; }
    p { margin: 0; }
    progress { width: min(320px, 75vw); justify-self: center; }
    button { justify-self: center; padding: 12px 24px; cursor: pointer; font: inherit; }

    html, body { background: #101817; color: #f1e7d0; }
    #loading { isolation: isolate; box-sizing: border-box; overflow: auto; place-content: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #101817; text-align: center; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading-icon { display: block; width: 76px; height: 76px; object-fit: cover; border-radius: 14px; box-shadow: 0 8px 32px #0008; }
    #loading h1 { color: #f1e7d0; font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(24px, 4vw, 42px); line-height: 1.12; }
    #loading-status { color: #c8c0a9; font-weight: 500; }
    #loading progress { display: block; width: min(320px, 75vw); height: 7px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #cda45f; background: #ffffff26; }
    #loading progress::-webkit-progress-bar { background: #ffffff26; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #cda45f; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #cda45f; border-radius: 20px; }
    #loading button { min-height: 44px; border: 1px solid #cda45f; border-radius: 10px; background: #18231f; color: #f1e7d0; }
    #loading button:focus-visible { outline: 3px solid #e3c58f; outline-offset: 4px; }
    #loading [hidden] { display: none; }
    @media (max-height: 480px) { #loading { gap: 8px; } #loading-icon { width: 56px; height: 56px; } #loading h1 { font-size: clamp(20px, 4vw, 30px); } }

        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? (zh ? '正在启动游戏…' : 'Starting game…')
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
